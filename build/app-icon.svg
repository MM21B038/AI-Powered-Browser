<?xml version="1.0" encoding="UTF-8"?>
<!-- Full-bleed #0c0c12; continuous-stroke infinity centered in 1024×1024 (no font / no white bands). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0c0c12"/>
  <!-- Path in local coords ~260×130; center (130,80) → translate to (512,512) scale ~2.65 -->
  <g transform="translate(512 512) scale(2.65) translate(-130 -80)">
    <path
      fill="none"
      stroke="url(#ribbon)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="
        M 30 80
        C 30 50 50 30 80 30
        C 110 30 130 50 130 80
        C 130 110 110 130 80 130
        C 50 130 30 110 30 80
        M 130 80
        C 130 50 150 30 180 30
        C 210 30 230 50 230 80
        C 230 110 210 130 180 130
        C 150 130 130 110 130 80
      "
    />
  </g>
</svg>
